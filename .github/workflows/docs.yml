# .github/workflows/docs.yml
# Builds the MkDocs site and deploys it to GitHub Pages.
# Only runs when docs/ or mkdocs.yml change on the production branch,
# so the published site always reflects REVIEWED, MERGED docs — no
# separate repo, no unreviewed edits.
name: docs

on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/gen_nav.py"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material mkdocs-gen-files mkdocs-literate-nav
      - run: mkdocs build           # outputs to ./site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
